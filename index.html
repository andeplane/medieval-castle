<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Moated Castle</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <style>
      /* One visual world: the scene is the page; UI is small stone-and-brass chips over it. */
      :root {
        --ink: #1b1e22; --bone: #ddd6c6; --chip: rgba(22, 24, 28, 0.74); --chip-line: rgba(221, 214, 198, 0.22);
        --brass: #c2a56a; --shadow: rgba(0, 0, 0, 0.8);
        --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--ink); color: var(--bone); overflow: hidden; font: 13px/1.4 var(--ui); }
      canvas { display: block; touch-action: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); color: var(--bone); letter-spacing: 0.14em; font-size: 12px; z-index: 10; transition: opacity 0.6s; }
      #ui { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 5; pointer-events: none; }
      #ui .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #ui button, #ui label { pointer-events: auto; }
      #ui button { background: var(--chip); color: var(--bone); border: 1px solid var(--chip-line); border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit; }
      #ui button:hover { border-color: var(--brass); }
      #ui button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
      #ui button.on { background: var(--brass); color: var(--ink); border-color: var(--brass); }
      #ui label { color: var(--bone); text-shadow: 0 1px 2px var(--shadow); display: flex; gap: 6px; align-items: center; margin-left: 6px; }
      #help { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); color: var(--bone); text-shadow: 0 1px 2px var(--shadow); text-align: right; opacity: 0.85; z-index: 5; pointer-events: none; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--bone); box-shadow: 0 0 0 1px var(--shadow); opacity: 0.8; z-index: 5; pointer-events: none; }
      #crosshair[hidden] { display: none; }
      body.shot #ui, body.shot #help, body.shot #crosshair { display: none; }
      @media (prefers-reduced-motion: reduce) { #loading { transition: none; } }
    </style>
  </head>
  <body>
    <div id="loading">BUILDING THE CASTLE…</div>
    <div id="ui"></div>
    <div id="help"></div>
    <div id="crosshair" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
